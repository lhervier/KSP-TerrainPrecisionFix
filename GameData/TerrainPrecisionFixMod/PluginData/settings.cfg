// How much Terrain Precision Fix writes to KSP.log: Error, Warning, Info, Debug or Trace.
//   Info  - one line at startup, then one line per body the first time its terrain is corrected.
//   Debug - adds one line per terrain quad placed, with how far it was moved.
//   Trace - adds, per quad, how far its vertices were moved. Slower: use it to measure, not to play.
// Read once when KSP starts: quit KSP, edit this file, start KSP again.
logLevel = Info
