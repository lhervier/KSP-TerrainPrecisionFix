// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Place the terrain in double precision: true or false.
fixTerrain = true

// Place the statics (the KSC buildings, and those of mods such as Kerbal Konstructs) in double
// precision: true or false.
fixStatics = true

// To place a static in double precision, the statics fix takes it out of the terrain sphere it hangs
// from, and two mods look for statics there. With the statics fix on, each of them needs its patch:
// leave both at true. Turn one off only to see what goes wrong without it.
//
// Kopernicus, when installed. With this at false and the statics fix on, its flag fix throws when a
// facility is upgraded in flight near the KSC, as a mission of the Making History expansion does when
// it spawns a craft there.
patchKopernicus = true
//
// Kerbal Konstructs, when installed. With this at false and the statics fix on, moving a group with its
// group editor in flight sends the group elsewhere on its body, and saves it there.
patchKerbalKonstructs = true

// How much Terrain Precision Fix writes to KSP.log: Error, Warning, Info, Debug or Trace.
//   Info  - a few lines at startup, then one line per body the first time its terrain, then its statics,
//           are corrected.
//   Debug - adds one line per terrain quad placed, and per static moved out of or back under its sphere.
//   Trace - adds, per quad, how far its vertices were moved. Slower: use it to measure, not to play.
logLevel = Info
