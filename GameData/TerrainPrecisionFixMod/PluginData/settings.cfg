// How much Terrain Precision Fix writes to KSP.log: Error, Warning, Info, Debug or Trace.
//   Info  - one line at startup, then one line per body the first time its terrain is corrected.
//   Debug - adds one line per terrain quad placed, with how far it was moved.
//   Trace - adds, per quad, how far its vertices were moved. Slower: use it to measure, not to play.
// Read once when KSP starts: quit KSP, edit this file, start KSP again.
logLevel = Info

// ---------------------------------------------------------------------------------------------------
// Performance measurement. Temporary, to be removed along with Src/Bench.cs once the figures are in.
// ---------------------------------------------------------------------------------------------------

// What to measure, if anything. Results are kept in memory and written only when asked for:
// Alt+F8 dumps them to KSP.log, Alt+F7 throws them away and starts again.
//   off       - nothing, as if the measuring code were not there.
//   counters  - what the terrain costs in flight, one line per second of game time.
//   calibrate - adds, on one quad in thirty-two, the stock formula timed against this one on the same
//               data. It does real extra work: do not read frame times from a run in this mode.
// Measure at logLevel = Info: Debug and Trace write to KSP.log on the very path being measured.
benchMode = off

// Set to false to leave the terrain exactly as stock builds it while still counting what it costs.
// That is the reference run of a performance campaign: same DLL, same save, one line changed. It also
// means the mod fixes nothing, so put it back to true afterwards.
patchEnabled = true
